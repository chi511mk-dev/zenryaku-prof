<title>千春の前略プロフ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#ff5fb0; --paper:#ffffff; --ink:#2b1a2a; --muted:#8a6f86; --line:#ffc2e2;
  --accent:#ff0f87; --accentpale:#ffe3f2; --sub:#00a8f0; --subpale:#dff5ff; --yellow:#fff200; --lime:#6bdc00; --purple:#9b30ff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--bg);color:var(--ink);
  background-image:radial-gradient(#ffffff 2.5px,transparent 3px),radial-gradient(#ffd1ea 2.5px,transparent 3px);
  background-size:22px 22px;background-position:0 0,11px 11px;
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:14px;line-height:1.75;
  padding-inline:16px;padding-block:24px 48px}
.page{max-width:420px;margin:0 auto;background:var(--paper);border:4px double var(--accent);border-radius:14px;padding:0 0 20px;overflow:hidden;
  box-shadow:6px 6px 0 var(--purple)}
.inner{padding:0 16px}
.dot{font-family:"DotGothic16",monospace;font-weight:400}
.ticker{background:#111;color:var(--yellow);font-family:"DotGothic16",monospace;font-size:13px;white-space:nowrap;overflow:hidden;border-bottom:3px solid var(--sub)}
.ticker span{display:inline-block;padding:5px 0 5px 100%;animation:tick 18s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
header{text-align:center;padding:14px 16px 14px;background:linear-gradient(180deg,var(--accentpale),#fff);border-bottom:3px dotted var(--accent)}
.kicker{font-size:11px;color:var(--sub);letter-spacing:.2em}
h1{margin:4px 0 2px;font-size:24px;line-height:1.4;text-wrap:balance;color:var(--accent);text-shadow:2px 2px 0 var(--yellow),-1px -1px 0 #fff;
  animation:blink 1s steps(1) infinite}
@keyframes blink{0%{color:var(--accent)}50%{color:var(--sub)}}
.sparkle{display:inline-block;animation:sp .8s steps(2) infinite}
@keyframes sp{50%{opacity:.15}}
.avatar{font-size:48px;line-height:1.2;margin-top:6px}
.avatar img,.pv img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:0 0 0 3px var(--yellow);display:block;margin:0 auto}
.pv{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pv img{width:64px;height:64px;margin:0}
.pv .ph{width:64px;height:64px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:30px}
.filebtn{display:inline-block;background:var(--subpale);border:2px solid var(--sub);color:#0078b0;border-radius:999px;padding:3px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn:focus-within{outline:3px solid var(--sub);outline-offset:2px}
.hitokoto{font-size:13px;margin:6px auto 0;display:inline-block;background:#fff;border:2px dashed var(--sub);border-radius:10px;padding:4px 12px}
.counter{margin-top:10px;font-size:12px;color:var(--muted)}
.counter b{display:inline-block;background:#111;color:var(--lime);font-family:"DotGothic16",monospace;font-weight:400;font-size:15px;letter-spacing:.15em;
  padding:0 6px;border-radius:3px;font-variant-numeric:tabular-nums}
.kiri{font-size:11.5px;color:var(--accent);font-weight:700}
.foot-line{font-size:12px;margin-top:2px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 16px 4px;font-size:13px}
nav button{background:var(--subpale);border:2px solid var(--sub);border-radius:999px;padding:4px 0;cursor:pointer;color:#0078b0;font:inherit;font-weight:700}
nav button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--purple)}
nav span{display:none}
h2{font-family:"DotGothic16",monospace;font-weight:400;font-size:14px;color:#fff;text-align:center;margin:22px 0 8px;letter-spacing:.05em;
  background:linear-gradient(90deg,var(--accent),var(--purple),var(--sub));border-radius:6px;padding:3px 8px;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
dl{margin:0}
.r{display:grid;grid-template-columns:8.5em 1fr;gap:8px;padding:5px 8px;border-bottom:1px dashed var(--line)}
.r:nth-child(even){background:#fff5fb}
.r dt{color:var(--accent);font-size:12.5px;font-weight:700}
.r dt::before{content:"💖";margin-right:3px;font-size:10px}
.r dd{margin:0;overflow-wrap:anywhere}
.last{background:var(--subpale);border:2px solid var(--sub);border-radius:10px;padding:8px 12px;margin-top:8px}
.last .q{font-size:12px;color:#0078b0;font-weight:700}
.last .q::before{content:"🌟 "}
.last .a{font-size:15px;font-weight:700}
.item{padding:10px 6px;border-bottom:2px dotted var(--line)}
.item .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .h b{color:var(--accent);font-weight:700}
.item p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.item .meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.ops{display:flex;gap:10px}
.xrow{display:grid;gap:4px;background:#fff5fb;border:2px dashed var(--line);border-radius:10px;padding:8px}
.xtop{display:flex;justify-content:space-between;align-items:center}
.xn{font-family:"DotGothic16",monospace;color:var(--accent);font-size:13px}
.xops{display:flex;gap:10px}
.link:disabled{opacity:.3;cursor:default}
.confirm{margin-top:8px;background:var(--accentpale);border:2px dashed var(--accent);border-radius:8px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--accent)}
.confirm div{display:flex;gap:6px}
.efm{display:grid;gap:6px;margin-top:6px}
.efm .acts{display:flex;justify-content:flex-end;gap:6px}
.btn.sm{padding:3px 14px;font-size:12px}
.reacts{display:flex;gap:6px;margin-top:6px}
.react{background:#fff;border:2px solid var(--line);border-radius:999px;padding:0 10px;font:inherit;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.react[aria-pressed="true"]{border-color:var(--accent);background:var(--yellow)}
.form{display:grid;gap:8px;padding:10px 0 4px}
.form label{font-size:12px;color:var(--muted);display:block}
input,textarea,select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.btn{justify-self:end;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:6px 20px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--purple)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--purple)}
.btn.plain{background:#fff;color:var(--sub);border:2px solid var(--sub);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--sub);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;font-weight:700}
.stamps{display:flex;gap:4px;flex-wrap:wrap}
.stampbtn{width:38px;height:38px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:18px;cursor:pointer;padding:0}
.stampbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--yellow)}
.empty{color:var(--muted);text-align:center;font-size:12.5px;padding:12px 0}
.editsec{display:grid;gap:6px}
.edit-actions{position:sticky;bottom:0;background:var(--paper);display:flex;justify-content:flex-end;gap:8px;padding:10px 0;border-top:2px dotted var(--accent);margin-top:14px}
footer{text-align:center;font-size:11px;color:var(--muted);margin:24px 16px 0;padding-top:12px;border-top:3px dotted var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sub);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;padding:6px 16px;border-radius:999px;border:2px solid #fff;z-index:10;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){h1,.sparkle{animation:none}.ticker span{animation:none;padding-left:8px}}
.avatar img{width:150px;height:200px;border-radius:14px;object-fit:cover}
.kakiko{display:block;text-align:center;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;border-radius:999px;padding:10px 12px;box-shadow:0 3px 0 var(--purple);margin:0 4px}
.kakiko:active{transform:translateY(2px);box-shadow:0 1px 0 var(--purple)}
.kakiko-note{text-align:center;font-size:11px;color:var(--muted);margin:6px 0 4px}
</style>
<div class="page">
  <div class="ticker" aria-hidden="true"><span id="tickerText"></span></div>
  <header>
    <div class="kicker dot">📱 前略プロフィール 📱</div>

</div>

$("hitokoto").textContent=P.hitokoto;
$("tickerText").textContent="✨ようこそ✨ "+P.hitokoto+" 💕 見に来てくれてありがとう📱💌 キリ番ふんだら教えてね🎉 相互リンク募集中⭐️";
$("count").textContent=String(DATA.visits).padStart(6,"0");
$("kiri").textContent="🎯次のキリ番は "+((Math.floor(DATA.visits/100)+1)*100)+" だよ！";
const d=new Date(P.updatedAt);$("updated").textContent=`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
$("profView").innerHTML=SECTIONS.map(s=>{
  const body=s.last?s.items.map(([k,l])=>`<div class="last"><div class="q">${l}</div><div class="a">${esc(v[k]||"―")}</div></div>`).join("")
    :`<dl>${s.items.map(([k,l])=>`<div class="r"><dt>${l}</dt><dd>${esc(v[k]||"―")}</dd></div>`).join("")}</dl>`;
  return`<h2>🎀 ${s.t} 🎀</h2>${body}`;
}).join("");
$("posts").innerHTML=DATA.posts.map(p=>`<div class="item"><div class="h"><span>${fmt(p.createdAt)}${p.edited?"（編集済み）":""}</span></div><p>${esc(p.text)}</p>
  ${p.mood||p.bgm?`<div class="meta">${p.mood?"気分："+esc(p.mood):""}${p.bgm?" ♪ "+esc(p.bgm):""}</div>`:""}
  <div class="reacts" style="font-size:12px;color:var(--muted)">🌰 ${p.r.nut||0}　🌸 ${p.r.flower||0}　⭐ ${p.r.star||0}</div></div>`).join("");
$("letters").innerHTML=DATA.letters.map(l=>`<div class="item"><div class="h"><b>${esc(l.icon)} ${esc(l.name)}</b><span>${esc(l.stamp)} ${fmt(l.createdAt)}</span></div><p>${esc(l.text)}</p></div>`).join("");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  ["prof","real","gb"].forEach(t=>$("t-"+t).hidden=t!==b.dataset.tab);
  document.querySelectorAll("nav button").forEach(x=>x===b?x.setAttribute("aria-current","page"):x.removeAttribute("aria-current"));
});
})();
</script>
