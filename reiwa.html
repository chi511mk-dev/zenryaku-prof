<title>令和の前略プロフ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#e7e1f7; --card:#ffffff; --ink:#2d2350; --sub:#6a5f93; --line:#2d2350; --soft:#f4f0ff;
  --accent:#ff5fc8; --accentsoft:#ffd4f1; --accentink:#8a1466; --pink:#ff8ad8; --cyan:#8ae3ff; --lime:#c9f27a; --yellow:#fff27a; --green:#2d2350;
  --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  background-image:linear-gradient(rgba(45,35,80,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(45,35,80,.07) 1px,transparent 1px);background-size:24px 24px;
  font-size:14.5px;line-height:1.65;padding-inline:16px;padding-block:24px 56px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px dashed var(--accent);outline-offset:3px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:var(--shadow)}
.pad{padding:16px}
.dot{font-family:"DotGothic16",monospace}

/* head */
.cover{height:110px;border-radius:19px 19px 0 0;border-bottom:2.5px solid var(--ink);position:relative;overflow:hidden;
  background-color:var(--cyan);
  background-image:repeating-conic-gradient(var(--pink) 0 25%,transparent 0 50%);background-size:28px 28px}
.cover::after{content:"★ since 2007 ★";position:absolute;right:12px;bottom:10px;font-family:"DotGothic16",monospace;font-size:12px;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;transform:rotate(-4deg)}
.cover::before{content:"✦";position:absolute;left:18px;top:8px;font-size:30px;color:#fff;-webkit-text-stroke:2px var(--ink)}
.head{padding:0 16px 18px;position:relative}
.av{width:96px;height:96px;border-radius:50%;border:3px solid var(--ink);background:var(--lime);margin-top:-48px;display:grid;place-items:center;font-size:48px;overflow:hidden;box-shadow:3px 3px 0 var(--ink);position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.editbtn{position:absolute;right:16px;top:14px;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.editbtn:active{transform:translate(2px,2px);box-shadow:none}
h1{margin:10px 0 0;font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:28px;letter-spacing:.02em;line-height:1.25;
  color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--accent)}
.handle{color:var(--sub);font-size:13.5px;font-family:"DotGothic16",monospace;margin-top:2px}
.tag{display:inline-block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:11px;font-weight:700;color:var(--ink);background:var(--accentsoft);border:2px solid var(--ink);border-radius:999px;padding:0 9px;margin-left:8px;vertical-align:1px;transform:rotate(3deg)}
.bio{margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:10px 12px;position:relative}
.stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.stats span{border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-size:12.5px;background:var(--card)}
.stats span:nth-child(1){background:var(--lime)}.stats span:nth-child(2){background:var(--cyan)}.stats span:nth-child(3){background:var(--pink)}
.stats b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-variant-numeric:tabular-nums;margin-right:3px}
.foot{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--sub);flex-wrap:wrap;font-family:"DotGothic16",monospace}
.foot .icons{letter-spacing:2px;font-family:inherit}

/* now playing */
.np{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:var(--yellow);background:var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--accent);border:2.5px solid var(--ink)}
.disc{width:48px;height:48px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--yellow) 0 18%,var(--ink) 19% 24%,var(--pink) 25% 100%);border:2px solid var(--yellow);animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.np .t{font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np .a{font-size:12.5px;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np .l{font-size:11px;color:var(--lime);letter-spacing:.12em;display:flex;align-items:center;gap:6px;font-family:"DotGothic16",monospace}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
.bars i{width:3px;background:var(--lime);animation:eq 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.4s}.bars i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}
.np .txt{min-width:0;flex:1}

/* links */
.links{display:grid;gap:10px}
.lk{display:flex;align-items:center;gap:10px;padding:11px 14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);text-decoration:none;color:var(--ink);font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.lk:nth-child(4n+1){background:var(--accentsoft)}.lk:nth-child(4n+2){background:#dff7ff}.lk:nth-child(4n+3){background:#efffd0}.lk:nth-child(4n+4){background:#fffbd0}
.lk:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.lk:active{transform:translate(3px,3px);box-shadow:none}
.lk .ic{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;flex:none}
.lk .u{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:400;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"DotGothic16",monospace}

/* tabs */
.tabs button{font-size:13px;padding:6px 0}
.nform{display:grid;gap:8px;background:var(--soft);border:2px dashed var(--ink);border-radius:18px;padding:12px}
.nform input,.nform textarea{width:100%;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:8px 10px;font:inherit;color:var(--ink)}
.nform textarea{min-height:140px;resize:vertical;line-height:1.8}
.nform .ttl{font-weight:700;font-size:16px}
.art{border:2px solid var(--ink);border-radius:18px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:14px;margin-top:12px}
.art h3{margin:0;font-size:17px;line-height:1.45;font-weight:900;overflow-wrap:anywhere;text-wrap:balance}
.art .date{font-family:"DotGothic16",monospace;font-size:12px;color:var(--sub)}
.art .ex{margin:6px 0 0;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}
.art .ex.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.art .acts2{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.suki{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 12px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.suki[aria-pressed="true"]{background:var(--accentsoft)}
.ext{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink);background:#efffd0;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;text-decoration:none}
.nimg{display:grid;gap:8px}
#nPv img{display:block;max-width:100%;max-height:220px;border-radius:12px;border:2px solid var(--ink)}
.art .pic{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:12px;border:2px solid var(--ink);margin:8px 0 4px}
.more{background:none;border:0;padding:0;color:var(--accentink);font-weight:700;font-size:12.5px;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 12px 0}
.badge{display:inline-block;min-width:18px;height:18px;line-height:14px;border-radius:999px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);font-size:11px;margin-left:4px;vertical-align:1px;font-variant-numeric:tabular-nums}
.paper{background:#fffdf5;border:2px solid var(--ink);border-radius:16px;padding:12px;background-image:repeating-linear-gradient(transparent 0 27px,#d9d0f2 27px 28px);background-position:0 10px}
.paper textarea{width:100%;min-height:150px;resize:vertical;border:0;background:transparent;font:inherit;line-height:28px;color:var(--ink);padding:0}
.paper input{width:100%;border:0;border-bottom:2px dotted var(--ink);background:transparent;font:inherit;color:var(--ink);padding:2px 0;margin-bottom:6px}
.stamps{display:flex;gap:6px;flex-wrap:wrap}
.stampbtn{width:40px;height:46px;border:2px dashed var(--ink);border-radius:6px;background:#fff;font-size:20px;cursor:pointer;padding:0}
.stampbtn[aria-pressed="true"]{border-style:solid;background:var(--accentsoft);box-shadow:2px 2px 0 var(--ink)}
.env{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--ink);border-radius:16px;background:#fff;cursor:pointer;width:100%;text-align:left;box-shadow:3px 3px 0 var(--ink);margin-top:10px}
.env.unread{background:var(--accentsoft)}
.env .st{font-size:22px;width:36px;height:42px;display:grid;place-items:center;border:2px dashed var(--ink);border-radius:5px;background:#fff;flex:none;transform:rotate(4deg)}
.env .who{font-weight:700}
.env .pv{display:block;font-size:12.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env .body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px;line-height:1.8}
.env .mm{min-width:0;flex:1}
.sent{font-size:12.5px;padding:8px 0;border-top:2px dotted var(--ink)}
.sent:first-child{border-top:0}
.tabs button{background:var(--soft);border:2px solid var(--ink);border-radius:999px;padding:6px 0;cursor:pointer;color:var(--ink);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.label{display:inline-block;font-family:"DotGothic16",monospace;font-size:13px;letter-spacing:.1em;color:var(--ink);background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:0 10px;margin:4px 0 10px;transform:rotate(-2deg)}
.sec:nth-child(3n+2) .label{background:var(--cyan);transform:rotate(1.5deg)}
.sec:nth-child(3n+3) .label{background:var(--lime)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 11px;min-width:0}
.cell .q{font-size:11.5px;color:var(--sub);font-family:"DotGothic16",monospace}
.cell .a{font-weight:700;overflow-wrap:anywhere}
.cell.wide{grid-column:1/-1}
.big{background:var(--accentsoft);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink)}
.big .q{font-size:12px;color:var(--accentink);font-weight:700}
.big .a{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:18px}
.sec+.sec{margin-top:18px}

/* question box */
.ask{background:var(--soft);border:2px dashed var(--ink);border-radius:18px;padding:12px}
.ask .label{margin-top:0}
.ask textarea{width:100%;min-height:84px;resize:vertical;border:2px solid var(--ink);background:#fff;border-radius:14px;padding:10px 12px;font:inherit;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:7px 20px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.sm{padding:4px 14px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.qa{padding:14px 0;border-top:2px dotted var(--ink)}
.qa:first-child{border-top:0}
.qa .qq{background:#fff;border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:9px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.qa .qq::before{content:"Q. ";font-family:"Dela Gothic One",sans-serif;color:var(--accent)}
.qa .aa{margin:8px 0 0 22px;background:var(--lime);border:2px solid var(--ink);border-radius:16px 16px 4px 16px;padding:9px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.qa .aa::before{content:"A. ";font-family:"Dela Gothic One",sans-serif}
.qa .meta{font-size:11.5px;color:var(--sub);margin-top:4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:"DotGothic16",monospace}
.qa textarea{width:100%;min-height:60px;margin-top:8px;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:8px 10px;font:inherit;color:var(--ink)}
.pill{font-size:11px;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--yellow);color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline}
.empty{color:var(--sub);text-align:center;font-size:13px;padding:18px 0;font-family:"DotGothic16",monospace}
.note{font-size:12px;color:var(--sub)}

/* edit */
.f label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:3px}
.f input,.f textarea,.f select{width:100%;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit}
.f textarea{min-height:70px;resize:vertical}
.fields{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xrow{display:grid;gap:6px;background:var(--soft);border:2px dashed var(--ink);border-radius:14px;padding:10px}
.xtop{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:700}
.xops{display:flex;gap:10px}
.link:disabled{opacity:.3;cursor:default}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;justify-content:flex-end;gap:10px;border-top:2.5px solid var(--ink)}
.pv{display:flex;gap:12px;align-items:center}
.pv .av{margin:0;width:68px;height:68px;font-size:32px}
.filebtn{display:inline-block;background:var(--cyan);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:13px;font-weight:700;cursor:pointer;position:relative;box-shadow:2px 2px 0 var(--ink)}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn:focus-within{outline:3px dashed var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--yellow);color:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:7px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:10;max-width:90%;text-align:center}
.credit{text-align:center;font-size:12px;color:var(--sub);font-family:"DotGothic16",monospace}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bars i{animation:none;height:8px}.disc{animation:none}.lk{transition:none}}
#tab-note,#tab-mail,#askBox,.stats,.foot,#assetsRow{display:none!important}
.tabs{grid-template-columns:1fr 1fr!important}
.viewonly{text-align:center;font-size:12px;color:var(--sub);font-family:"DotGothic16",monospace}
</style>

<div class="wrap">
  <!-- VIEW -->
  <div id="view" class="wrap" style="gap:14px">
    <div class="card">
      <div class="cover"></div>
      <div class="head">
        <button class="editbtn" id="openEdit" hidden>プロフを編集</button>
        <div class="av" id="av">🐿️</div>
        <h1 id="name">…</h1>
        <div class="handle"><span id="handle"></span><span class="tag">前略プロフ</span></div>
        <p class="bio" id="bio"></p>
        <div class="stats"><span><b id="stVisit">0</b>足あと</span><span><b id="stAns">0</b>回答</span><span><b id="stQ">0</b>質問</span></div>
        <div class="foot">今日の足あと <span class="icons" id="todayIcons"></span></div>
      </div>
    </div>

    <a class="card np" id="np" target="_blank" rel="noopener noreferrer" hidden>
      <div class="disc" aria-hidden="true"></div>
      <div class="txt"><div class="l"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>NOW PLAYING</div><div class="t" id="npT"></div><div class="a" id="npA"></div></div>
    </a>

    <div class="links" id="links"></div>

    <div class="card">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="prof" id="tab-prof">プロフ</button>
        <button role="tab" aria-selected="false" data-tab="note" id="tab-note">日記</button>
        <button role="tab" aria-selected="false" data-tab="qbox" id="tab-qbox">質問箱</button>
        <button role="tab" aria-selected="false" data-tab="mail" id="tab-mail">お手紙<span class="badge" id="mailBadge" hidden></span></button>
      </div>
      <div class="pad" id="p-prof"></div>
      <div class="pad" id="p-note" hidden>
        <div class="nform" id="nForm" hidden>
          <div class="label" style="margin:0" id="nFormTitle">日記を書く</div>
          <input class="ttl" id="nTitle" maxlength="80" placeholder="タイトル" aria-label="タイトル">
          <textarea id="nBody" maxlength="5000" placeholder="本文" aria-label="本文"></textarea>
          <div class="nimg"><div id="nPv"></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="filebtn" id="nFileLbl">📷 画像をつける<input type="file" id="nImg" accept="image/png,image/jpeg,image/gif,image/webp"></label><button class="link" id="nImgClear" type="button" hidden>画像をはずす</button><span class="note" id="nImgMsg"></span></div></div>
          <div class="row" style="justify-content:flex-end"><button class="btn ghost sm" id="nCancel" hidden>やめる</button><button class="btn sm" id="nSave">投稿する</button></div>
        </div>
        <div id="notes"></div>
      </div>
      <div class="pad" id="p-qbox" hidden>
        <div class="ask" id="askBox">
          <div class="label">匿名で質問する</div>
          <textarea id="qText" maxlength="200" placeholder="なんでも気軽に聞いてね" aria-label="質問"></textarea>
          <div class="row"><span class="note">名前は送られません。答えると公開されます</span><button class="btn sm" id="qSend">送る</button></div>
        </div>
        <div id="pending" style="margin-top:16px"></div>
        <div class="label" style="margin-top:18px">回答ずみ</div>
        <div id="answered"></div>
      </div>
      <div class="pad" id="p-mail" hidden>
        <div id="mailWrite">
          <div class="label">お手紙をかく</div>
          <p class="note" style="margin:0 0 8px">ここに書いた手紙は、プロフの持ち主だけが読めます。公開はされません。</p>
          <div class="paper">
            <input id="mFrom" maxlength="20" placeholder="なまえ（なくてもOK）" aria-label="なまえ">
            <textarea id="mText" maxlength="1000" placeholder="元気？最近どうしてる？" aria-label="手紙の本文"></textarea>
          </div>
          <div class="row"><div class="stamps" id="mStamps" aria-label="切手"></div><button class="btn sm" id="mSend">ポストに入れる</button></div>
          <div id="mSentWrap" hidden style="margin-top:16px"><div class="label">あなたが送った手紙</div><div id="mSent"></div></div>
        </div>
        <div id="mailInbox" hidden>
          <div class="label">とどいた手紙</div>
          <p class="note" style="margin:0">あなたにだけ見えています。タップすると開きます。</p>
          <div id="inbox"></div>
        </div>
        <div id="mailOff" class="empty" hidden>いまはお手紙を送れません</div>
      </div>
    </div>
    <div class="viewonly">※見るだけ版です📱</div>
    <div class="credit">もしも前略プロフが現代にあったら／私のインターネット史</div>
  </div>

  <!-- EDIT -->
  <div id="edit" class="wrap f" hidden>
    <div class="card pad">
      <div class="label">アイコン・名前</div>
      <div class="fields">
        <div class="pv" id="imgRow"><div class="av" id="pvAv"></div><div style="display:grid;gap:6px;justify-items:start">
          <label class="filebtn" id="fileLbl">画像をえらぶ<input type="file" id="eImg" accept="image/png,image/jpeg,image/gif,image/webp"></label>
          <button class="link" id="eImgClear" type="button">画像をはずす</button><span class="note" id="imgMsg"></span></div></div>
        <div class="two"><div><label for="eEmoji">画像がないときの絵文字</label><select id="eEmoji"></select></div>
          <div><label for="eHandle">ID</label><input id="eHandle" maxlength="24" placeholder="@chiharu"></div></div>
        <div><label for="eName">名前</label><input id="eName" maxlength="24"></div>
        <div><label for="eBio">ひとこと（自己紹介）</label><textarea id="eBio" maxlength="160"></textarea></div>
      </div>
    </div>

  $("askBox").hidden=!canWrite||isOwner;
  const pend=questions.filter(q=>!q.answer);
  $("pending").innerHTML=isOwner?(pend.length?`<div class="label">未回答 ${pend.length}</div>`+pend.map(q=>`<div class="qa"><div class="qq">${esc(q.text)}</div>
    <div class="meta"><span class="pill">未回答</span>${ago(q.createdAt)}<button class="link" data-del="${q.id}">削除</button></div>
    ${answering===q.id?`<textarea id="ansText" maxlength="400" aria-label="回答">${esc(answerDraft)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" id="ansCancel">やめる</button><button class="btn sm" id="ansSave">回答して公開</button></div>`
    :`<div class="row" style="justify-content:flex-end"><button class="btn sm" data-ans="${q.id}">答える</button></div>`}</div>`).join(""):'<div class="note">未回答の質問はありません</div>'):"";
  const done=questions.filter(q=>q.answer).sort((a,b)=>(b.answeredAt||"").localeCompare(a.answeredAt||""));
  $("answered").innerHTML=done.length?done.map(q=>`<div class="qa"><div class="qq">${esc(q.text)}</div><div class="aa">${esc(q.answer)}</div>
    <div class="meta" style="justify-content:flex-end">${ago(q.answeredAt)}${isOwner?`<button class="link" data-edit="${q.id}">回答を直す</button><button class="link" data-del="${q.id}">削除</button>`:""}</div>
    ${answering===q.id?`<textarea id="ansText" maxlength="400" aria-label="回答">${esc(answerDraft)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" id="ansCancel">やめる</button><button class="btn sm" id="ansSave">保存</button></div>`:""}</div>`).join(""):'<div class="empty">まだ回答はありません</div>';
  document.querySelectorAll("[data-ans],[data-edit]").forEach(b=>b.onclick=()=>{const id=b.dataset.ans||b.dataset.edit;answering=id;answerDraft=(questions.find(q=>q.id===id)||{}).answer||"";renderQ();$("ansText").focus()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="本当に削除？";setTimeout(()=>{if(b.isConnected){b.dataset.confirm="";b.textContent="削除"}},3000);return}
    try{await db.doc("questions/"+b.dataset.del).delete();toast("削除しました")}catch(e){fail(e)}});
  if($("ansText")){
    $("ansText").oninput=e=>answerDraft=e.target.value;
    $("ansCancel").onclick=()=>{answering=null;renderQ()};
    $("ansSave").onclick=async()=>{const a=$("ansText").value.trim();if(!a){$("ansText").focus();return}
      $("ansSave").disabled=true;
      try{await db.doc("questions/"+answering).update({answer:a,answeredAt:new Date().toISOString()});answering=null;renderQ();toast("回答を公開しました")}
      catch(e){fail(e);$("ansSave").disabled=false}};
  }
}
$("qSend").onclick=async()=>{
  const t=$("qText").value.trim();if(!t){$("qText").focus();return}
  if(!db){toast("いまは送れません");return}
  $("qSend").disabled=true;
  try{await db.collection("questions").add({text:t,createdAt:new Date().toISOString()});$("qText").value="";toast("質問を送りました！答えが届くと公開されます")}
  catch(e){fail(e)}finally{$("qSend").disabled=false}
};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  $("p-prof").hidden=b.dataset.tab!=="prof";$("p-qbox").hidden=b.dataset.tab!=="qbox";$("p-mail").hidden=b.dataset.tab!=="mail";$("p-note").hidden=b.dataset.tab!=="note";
});

/* ---------- edit ---------- */
let draftImg=null,draftUrl=null,linkDraft=[],extraDraft=[];
$("eEmoji").innerHTML=EMOJIS.map(e=>`<option>${e}</option>`).join("");
function renderPv(){
  $("pvAv").innerHTML=draftUrl?`<img src="${esc(draftUrl)}" alt="">`:esc($("eEmoji").value);
  $("fileLbl").hidden=!assets;$("eImgClear").hidden=!draftUrl;
}
$("eEmoji").onchange=renderPv;
$("eImg").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!assets)return;
  $("imgMsg").textContent="アップロード中…";$("saveEdit").disabled=true;
  try{const r=await assets.upload(f);draftImg=r.id;draftUrl=r.url;$("imgMsg").textContent="保存すると反映されます";renderPv()}
  catch(err){$("imgMsg").textContent=err&&err.code==="unsupported_type"?"PNG・JPEG・GIF・WebPを選んでください":err&&err.code==="too_large"?"20MBより小さい画像にしてください":"アップロードできませんでした"}
  finally{$("saveEdit").disabled=false}
};
$("eImgClear").onclick=()=>{draftImg=null;draftUrl=null;renderPv()};
function listEditor(boxId,arr,fields,rerender){
  $(boxId).innerHTML=arr.length?arr.map((x,i)=>`<div class="xrow"><div class="xtop"><span>${i+1}</span><span class="xops">
    <button type="button" class="link" data-up="${i}" ${i===0?"disabled":""} aria-label="上へ">↑</button><button type="button" class="link" data-down="${i}" ${i===arr.length-1?"disabled":""} aria-label="下へ">↓</button><button type="button" class="link" data-rm="${i}">削除</button></span></div>
    ${fields.map(([k,ph,type])=>`<input data-f="${k}" data-i="${i}" ${type?`type="${type}"`:""} maxlength="200" placeholder="${ph}" aria-label="${ph}" value="${esc(x[k]||"")}">`).join("")}</div>`).join(""):'<div class="note">まだありません</div>';
  const box=$(boxId);
  box.querySelectorAll("[data-f]").forEach(el=>el.oninput=()=>arr[+el.dataset.i][el.dataset.f]=el.value);
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.rm,1);rerender()});
  box.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[arr[i-1],arr[i]]=[arr[i],arr[i-1]];rerender()});
  box.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{const i=+b.dataset.down;[arr[i+1],arr[i]]=[arr[i],arr[i+1]];rerender()});
}
const renderLinks=()=>listEditor("linkEdit",linkDraft,[["label","表示名（例：Instagram）"],["url","https://","url"]],renderLinks);
const renderExtra=()=>listEditor("extraEdit",extraDraft,[["q","質問（例：好きな着うた）"],["a","答え"]],renderExtra);
$("addLink").onclick=()=>{if(linkDraft.length>=12)return;linkDraft.push({label:"",url:""});renderLinks()};
$("addExtra").onclick=()=>{if(extraDraft.length>=30)return;extraDraft.push({q:"",a:""});renderExtra()};
$("openEdit").onclick=()=>{
  const p=profile,v=p.values||{};
  $("eName").value=p.name||"";$("eHandle").value=p.handle||"";$("eBio").value=p.bio||"";$("eEmoji").value=p.avatar||"🐿️";
  const np=p.nowPlaying||{};$("eNpT").value=np.title||"";$("eNpA").value=np.artist||"";$("eNpU").value=np.url||"";
  draftImg=p.avatarImg||null;draftUrl=draftImg?"/_blob/"+draftImg:null;$("imgMsg").textContent="";renderPv();
  linkDraft=(p.links||[]).map(x=>({...x}));extraDraft=(p.extra||[]).map(x=>({...x}));renderLinks();renderExtra();
  $("qEdit").innerHTML=SECTIONS.map(s=>`<div class="label" style="margin-top:6px">${s.t}</div><div class="fields">${s.items.map(([k,l])=>`<div><label for="e-${k}">${l}</label><input id="e-${k}" data-k="${k}" maxlength="60" value="${esc(v[k]||"")}"></div>`).join("")}</div>`).join("");
  $("view").hidden=true;$("edit").hidden=false;window.scrollTo({top:0});
};
$("cancelEdit").onclick=()=>{$("edit").hidden=true;$("view").hidden=false};
$("saveEdit").onclick=async()=>{
  if(!db){toast("いまは保存できません");return}
  const values={};document.querySelectorAll("#qEdit [data-k]").forEach(i=>values[i.dataset.k]=i.value.trim());
  const links=linkDraft.map(l=>({label:(l.label||"").trim(),url:(l.url||"").trim()})).filter(l=>l.url);
  const bad=links.find(l=>!safeUrl(l.url));if(bad){toast("リンクは https:// から始まるURLにしてください");return}
  const body={name:$("eName").value.trim(),handle:$("eHandle").value.trim(),bio:$("eBio").value.trim(),avatar:$("eEmoji").value,avatarImg:draftImg||null,
    nowPlaying:{title:$("eNpT").value.trim(),artist:$("eNpA").value.trim(),url:$("eNpU").value.trim()},
    links,values,extra:extraDraft.map(x=>({q:(x.q||"").trim(),a:(x.a||"").trim()})).filter(x=>x.q||x.a),updatedAt:new Date().toISOString()};
  $("saveEdit").disabled=true;
  try{await db.doc("profile/main").set(body);profile=body;renderAll();$("edit").hidden=true;$("view").hidden=false;window.scrollTo({top:0});toast("保存しました")}
  catch(e){fail(e)}finally{$("saveEdit").disabled=false}
};

/* ---------- letter box ---------- */
const STAMPS=["💌","🌸","⭐","🍓","🌈","📮"];
let myId=null,letterDocs=[],mine=[],readSet=new Set(),mStamp=STAMPS[0],openId=null;
$("mStamps").innerHTML=STAMPS.map((x,i)=>`<button class="stampbtn" data-s="${x}" aria-pressed="${i===0}" aria-label="切手 ${x}">${x}</button>`).join("");
document.querySelectorAll(".stampbtn").forEach(b=>b.onclick=()=>{mStamp=b.dataset.s;document.querySelectorAll(".stampbtn").forEach(x=>x.setAttribute("aria-pressed",x===b))});
function fmtD(iso){const d=new Date(iso);return isNaN(d)?"":`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function renderMail(){
  const ok=!!db&&!!myId;
  $("mailOff").hidden=ok||isOwner;
  $("mailWrite").hidden=isOwner||!ok;
  $("mailInbox").hidden=!isOwner;
  $("mSentWrap").hidden=!mine.length;
  $("mSent").innerHTML=mine.slice().reverse().map(l=>`<div class="sent"><span class="dot">${esc(l.stamp)} ${fmtD(l.at)}</span><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(l.text)}</div></div>`).join("");
  if(isOwner){
    const all=[];letterDocs.forEach(d=>(d.items||[]).forEach(it=>all.push({...it,uid:d.id})));
    all.sort((a,b)=>(b.at||"").localeCompare(a.at||""));
    const unread=all.filter(l=>!readSet.has(l.id)).length;
    $("mailBadge").hidden=!unread;$("mailBadge").textContent=unread;
    $("inbox").innerHTML=all.length?all.map(l=>{const open=openId===l.id,un=!readSet.has(l.id);
      return`<button class="env${un?" unread":""}" data-open="${esc(l.id)}" aria-expanded="${open}"><span class="st">${esc(l.stamp)}</span><span class="mm"><span class="who">${esc(l.icon||"")} ${esc(l.from||"名無しさん")}</span>${un?' <span class="pill">NEW</span>':""}<br><span class="note">${fmtD(l.at)}</span>
      ${open?`<div class="body">${esc(l.text)}</div>`:`<div class="pv">${esc(l.text)}</div>`}</span></button>`}).join(""):'<div class="empty">まだ手紙はとどいていません</div>';
    document.querySelectorAll("[data-open]").forEach(b=>b.onclick=async()=>{
      const id=b.dataset.open;openId=openId===id?null:id;
      if(!readSet.has(id)){readSet.add(id);renderMail();try{await db.doc("inboxstate/main").set({read:[...readSet].slice(-2000)})}catch(e){}}
      else renderMail();
    });
  }
}
$("mSend").onclick=async()=>{
  const text=$("mText").value.trim();if(!text){$("mText").focus();return}
  if(!db||!myId){toast("いまは送れません");return}
  $("mSend").disabled=true;
  const item={id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),from:$("mFrom").value.trim(),text,stamp:mStamp,icon:local.icon,at:new Date().toISOString()};
  try{const next=[...mine,item].slice(-100);await db.doc("letters/"+myId).set({items:next,lastAt:item.at});mine=next;
    $("mText").value="";toast("📮 ポストに入れました！");renderMail()}
  catch(e){fail(e)}finally{$("mSend").disabled=false}
};

/* ---------- note ---------- */
let notes=[],sukis=[],nEditId=null,nOpen=new Set(),nImgId=null,nImgUrl=null;
function renderNPv(){$("nPv").innerHTML=nImgUrl?`<img src="${esc(nImgUrl)}" alt="添付する画像">`:"";$("nImgClear").hidden=!nImgUrl;$("nFileLbl").hidden=!assets}
function renderNotes(){
  $("nForm").hidden=!isOwner;
  const my=new Set(sukis.filter(x=>x.key===local.key).map(x=>x.post));
  $("notes").innerHTML=notes.length?notes.map(n=>{
    const long=(n.body||"").length>90,open=nOpen.has(n.id);
    const c=(sukis.filter(x=>x.post===n.id).length);
    return`<article class="art"><div class="date">${fmtD(n.createdAt)}${n.editedAt?"（編集済み）":""}</div><h3>${esc(n.title||"無題")}</h3>${n.img?`<img class="pic" src="/_blob/${esc(n.img)}" alt="" loading="lazy" onerror="this.remove()">`:""}
      ${n.body?`<p class="ex${long&&!open?" clip":""}">${esc(n.body)}</p>${long?`<button class="more" data-more="${n.id}">${open?"とじる":"つづきを読む"}</button>`:""}`:""}
      <div class="acts2"><button class="suki" data-suki="${n.id}" aria-pressed="${my.has(n.id)}">♡ スキ ${c}</button>
      ${isOwner?`<span style="margin-left:auto;display:flex;gap:10px"><button class="link" data-nedit="${n.id}">編集</button><button class="link" data-ndel="${n.id}">削除</button></span>`:""}</div></article>`}).join(""):'<div class="empty">まだ日記はありません</div>';
  document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{const id=b.dataset.more;nOpen.has(id)?nOpen.delete(id):nOpen.add(id);renderNotes()});
  document.querySelectorAll("[data-suki]").forEach(b=>b.onclick=async()=>{
    if(!db){toast("いまはスキできません");return}
    const id=`${b.dataset.suki}.${local.key}`,on=b.getAttribute("aria-pressed")==="true";b.disabled=true;
    try{on?await db.doc("sukis/"+id).delete():await db.doc("sukis/"+id).set({post:b.dataset.suki,key:local.key})}catch(e){fail(e)}finally{b.disabled=false}});
  document.querySelectorAll("[data-nedit]").forEach(b=>b.onclick=()=>{const n=notes.find(x=>x.id===b.dataset.nedit);nEditId=n.id;
    $("nTitle").value=n.title||"";$("nBody").value=n.body||"";nImgId=n.img||null;nImgUrl=nImgId?"/_blob/"+nImgId:null;$("nImgMsg").textContent="";renderNPv();$("nFormTitle").textContent="日記を編集";$("nSave").textContent="保存する";$("nCancel").hidden=false;$("nForm").scrollIntoView({behavior:"smooth",block:"start"})});
  document.querySelectorAll("[data-ndel]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="本当に削除？";setTimeout(()=>{if(b.isConnected){b.dataset.confirm="";b.textContent="削除"}},3000);return}
    try{await db.doc("notes/"+b.dataset.ndel).delete();toast("削除しました")}catch(e){fail(e)}});
}
function resetNForm(){nEditId=null;$("nTitle").value="";$("nBody").value="";nImgId=null;nImgUrl=null;$("nImgMsg").textContent="";renderNPv();$("nFormTitle").textContent="日記を書く";$("nSave").textContent="投稿する";$("nCancel").hidden=true}
$("nCancel").onclick=resetNForm;
$("nImgClear").onclick=()=>{nImgId=null;nImgUrl=null;$("nImgMsg").textContent="";renderNPv()};
$("nImg").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!assets)return;
  $("nImgMsg").textContent="アップロード中…";$("nSave").disabled=true;
  try{const r=await assets.upload(f);nImgId=r.id;nImgUrl=r.url;$("nImgMsg").textContent="";renderNPv()}
  catch(err){$("nImgMsg").textContent=err&&err.code==="unsupported_type"?"PNG・JPEG・GIF・WebPを選んでください":err&&err.code==="too_large"?"20MBより小さい画像にしてください":"アップロードできませんでした"}
  finally{$("nSave").disabled=false}
};
$("nSave").onclick=async()=>{
  const title=$("nTitle").value.trim(),body=$("nBody").value.trim(),img=nImgId||null;
  if(!title){$("nTitle").focus();return}
  if(!db){toast("いまは保存できません");return}
  $("nSave").disabled=true;
  try{
    if(nEditId)await db.doc("notes/"+nEditId).update({title,body,img,editedAt:new Date().toISOString()});
    else await db.collection("notes").add({title,body,img,createdAt:new Date().toISOString()});
    toast(nEditId?"保存しました":"投稿しました");resetNForm();
  }catch(e){fail(e)}finally{$("nSave").disabled=false}
};

function renderAll(){renderHead();renderStats();renderProf();renderQ();renderMail();renderNotes();renderNPv()}
renderAll();

(async()=>{
  const use=n=>window.claude?.use?.(n)??null;
  const [d,u,a]=await Promise.all([use("db"),use("user"),use("assets")]);
  db=d;assets=a;
  if(u){isOwner=!!(await u.canEdit());canWrite=(await u.can("data.write"))!==false;myId=await u.id()}
  if(!db){canWrite=false;renderAll();return}
  const err=()=>{};let first=true;
  db.doc("profile/main").onSnapshot(s=>{if(s.exists){profile=s.data();if($("edit").hidden){renderHead();renderProf()}}},err);
  db.collection("questions").orderBy("createdAt","desc").limit(300).onSnapshot(s=>{questions=s.docs.map(x=>({id:x.id,...x.data()}));renderStats();if(!$("ansText"))renderQ()},err);
  db.collection("visits").limit(2000).onSnapshot(s=>{visits=s.docs.map(x=>x.data());renderStats();
    if(first&&!s.metadata.fromCache){first=false;const dk=dayKey(new Date());
      if(!visits.some(v=>v.date===dk&&v.key===local.key))db.doc(`visits/${dk}.${local.key}`).set({date:dk,key:local.key,icon:local.icon}).catch(()=>{})}},err);
  db.collection("notes").orderBy("createdAt","desc").limit(200).onSnapshot(x=>{notes=x.docs.map(d=>({id:d.id,...d.data()}));renderNotes()},err);
  db.collection("sukis").limit(2000).onSnapshot(x=>{sukis=x.docs.map(d=>d.data());renderNotes()},err);
  if(myId&&!isOwner)db.doc("letters/"+myId).onSnapshot(x=>{mine=x.exists?(x.data().items||[]):[];renderMail()},err);
  if(isOwner){
    db.collection("letters").limit(1000).onSnapshot(x=>{letterDocs=x.docs.map(d=>({id:d.id,...d.data()}));renderMail()},err);
    db.doc("inboxstate/main").onSnapshot(x=>{if(x.exists){readSet=new Set(x.data().read||[]);renderMail()}},err);
  }
  renderAll();
})();
})();
</script>
